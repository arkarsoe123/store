<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ကုန်ပစ္စည်းဈေးနှုန်း</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Prices">
    
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3514/3514491.png">
    
    <!-- Dynamic Manifest Link -->
    <link rel="manifest" id="manifest-link" href="">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; font-size: 14px; -webkit-tap-highlight-color: transparent; }
        .modal { transition: opacity 0.2s ease, transform 0.2s ease; }
        body.modal-active { overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        td { padding: 12px 12px !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white shadow-md p-3 sticky top-0 z-20">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-lg flex items-center">
                <i class="fas fa-box-open mr-2"></i> ဦးမောင်လွင်ကုန်ပစ္စည်းစာရင်း
            </h1>
            <div class="flex gap-2">
                <!-- PWA Install Button -->
                <button id="installBtn" class="hidden bg-white/20 text-white px-3 py-1.5 rounded-xl text-sm font-bold hover:bg-white/30 transition flex items-center">
                    <i class="fas fa-download mr-1.5"></i> App သွင်းမည်
                </button>
                <button onclick="openAddModal()" class="bg-white text-blue-600 px-3 py-1.5 rounded-xl text-sm font-bold hover:bg-gray-100 transition flex items-center shadow-sm">
                    <i class="fas fa-plus mr-1.5"></i> ထည့်ရန်
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto p-3">
        <!-- Search & Filter -->
        <div class="flex gap-2 mb-3">
            <div class="relative flex-1">
                <input type="text" id="searchInput" placeholder="အမည် သို့မဟုတ် အမျိုးအစားဖြင့် ရှာပါ..." class="w-full rounded-2xl border-gray-200 shadow-sm focus:ring-2 focus:ring-blue-500 border p-3 pl-10 outline-none text-sm bg-white">
                <i class="fas fa-search absolute left-3.5 top-4 text-gray-400"></i>
            </div>
            <div id="totalItems" class="bg-white border text-blue-600 text-xs font-bold px-4 py-3 rounded-2xl flex items-center shadow-sm whitespace-nowrap">
                ၀ မျိုး
            </div>
        </div>

        <!-- Category Chips -->
        <div class="mb-3 flex gap-2 overflow-x-auto hide-scrollbar py-1" id="categoryBar"></div>

        <!-- Product Table Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden relative">
            <!-- Loading Overlay -->
            <div id="loadingOverlay" class="absolute inset-0 bg-white/85 backdrop-blur-sm flex items-center justify-center z-10 hidden">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-600 mx-auto mb-2"></div>
                    <span class="text-xs text-gray-500">လုပ်ဆောင်နေပါသည်...</span>
                </div>
            </div>

            <table class="min-w-full divide-y divide-gray-100">
                <thead class="bg-gray-50">
                    <tr class="text-[11px] text-gray-500 uppercase font-bold tracking-wider">
                        <th class="px-4 py-3 text-left">ကုန်ပစ္စည်း</th>
                        <th class="px-4 py-3 text-left hidden sm:table-cell">အမျိုးအစား</th>
                        <th class="px-4 py-3 text-right">ရောင်းဈေး</th>
                        <th class="px-4 py-3 text-center">အသေးစိတ်</th>
                    </tr>
                </thead>
                <tbody id="productList" class="divide-y divide-gray-100 text-sm"></tbody>
            </table>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16">
                <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-3 text-gray-400 text-2xl">
                    <i class="fas fa-box-open"></i>
                </div>
                <p class="text-gray-400 text-sm italic" id="emptyStateText">စာရင်းမရှိသေးပါ။</p>
            </div>
        </div>
    </div>

    <!-- Product Form Modal (Add / Edit) -->
    <div id="formModal" class="fixed inset-0 z-50 flex items-center justify-center opacity-0 pointer-events-none modal transition-all duration-200">
        <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm" onclick="closeFormModal()"></div>
        <div class="bg-white w-full max-w-sm mx-4 p-5 rounded-2xl shadow-2xl relative z-10 max-h-[90vh] overflow-y-auto">
            <h2 id="formModalTitle" class="text-lg font-bold text-gray-800 mb-4 flex items-center border-b pb-2">
                <i class="fas fa-pen-to-square text-blue-500 mr-2"></i> စာရင်းအသစ်
            </h2>
            <form id="productForm" class="space-y-3">
                <input type="hidden" id="editProductId">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">နေ့စွဲ</label>
                    <input type="date" id="formDate" required class="w-full rounded-xl border-gray-200 bg-gray-50 focus:bg-white border p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">ကုန်ပစ္စည်းအမည်</label>
                    <input type="text" id="formName" required placeholder="အမည်ရိုက်ထည့်ပါ" class="w-full rounded-xl border-gray-200 bg-gray-50 focus:bg-white border p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">အမှတ်တံဆိပ် (Brand)</label>
                    <input type="text" id="formBrand" placeholder="အမှတ်တံဆိပ်ရိုက်ထည့်ပါ (မရှိက ချန်ထားနိုင်သည်)" class="w-full rounded-xl border-gray-200 bg-gray-50 focus:bg-white border p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-1">အမျိုးအစား</label>
                    <input list="categories" id="formCategory" required placeholder="အမျိုးအစားရွေးပါ သို့မဟုတ် အသစ်ရိုက်ပါ" class="w-full rounded-xl border-gray-200 bg-gray-50 focus:bg-white border p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition text-sm">
                    <datalist id="categories">
                        <option value="ဆိုင်ကယ်ပစ္စည်း"></option>
                        <option value="စားသောက်ကုန်"></option>
                        <option value="အလှကုန်"></option>
                        <option value="အထွေထွေ"></option>
                    </datalist>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">ဝယ်ဈေး (Ks)</label>
                        <input type="number" id="formBuyPrice" required placeholder="ဝယ်ရင်းဈေး" class="w-full rounded-xl border-gray-200 bg-gray-50 focus:bg-white border p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 mb-1">ရောင်းဈေး (Ks)</label>
                        <input type="number" id="formSellPrice" required placeholder="ရောင်းဈေး" class="w-full rounded-xl border-gray-200 bg-gray-50 focus:bg-white border p-3 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition text-sm">
                    </div>
                </div>

                <div class="flex gap-2 pt-3">
                    <button type="button" onclick="closeFormModal()" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3 rounded-xl text-sm transition">ပိတ်မည်</button>
                    <button type="submit" id="submitBtn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-md shadow-blue-500/20">သိမ်းမည်</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 flex items-center justify-center opacity-0 pointer-events-none modal transition-all duration-200">
        <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm" onclick="closeDetailModal()"></div>
        <div class="bg-white w-full max-w-sm mx-4 p-6 rounded-2xl shadow-2xl relative z-10">
            <h2 class="text-lg font-bold text-gray-800 mb-4 flex items-center border-b pb-2">
                <i class="fas fa-circle-info text-blue-500 mr-2"></i> ကုန်ပစ္စည်း အသေးစိတ်
            </h2>
            
            <div id="detailContent" class="space-y-4">
                <!-- Content will be injected here dynamically -->
            </div>

            <!-- Action Buttons inside detail view -->
            <div class="grid grid-cols-3 gap-2 mt-6 border-t pt-4">
                <button onclick="editFromDetail()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-1">
                    <i class="fas fa-edit"></i> ပြင်ဆင်ရန်
                </button>
                <button onclick="deleteFromDetail()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-2.5 rounded-xl text-sm transition flex items-center justify-center gap-1">
                    <i class="fas fa-trash-alt"></i> ဖျက်ရန်
                </button>
                <button onclick="closeDetailModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl text-sm transition flex items-center justify-center">
                    ပိတ်မည်
                </button>
            </div>
        </div>
    </div>

    <script>
        // PWA Manifest Configuration
        const manifestData = {
            name: "ကုန်ပစ္စည်းဈေးနှုန်းမှတ်တမ်း",
            short_name: "Prices",
            start_url: ".",
            display: "standalone",
            background_color: "#f3f4f6",
            theme_color: "#2563eb",
            icons: [
                {
                    src: "https://cdn-icons-png.flaticon.com/512/3514/3514491.png",
                    sizes: "512x512",
                    type: "image/png",
                    purpose: "any maskable"
                }
            ]
        };
        const manifestString = JSON.stringify(manifestData);
        document.getElementById('manifest-link').setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(manifestString));

        // PWA Installer Trigger
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.classList.add('hidden');
                }
                deferredPrompt = null;
            }
        });

        // -------------------------------------------------
        // Core Application Logic (SheetDB)
        // -------------------------------------------------
        const SHEETDB_URL = "https://sheetdb.io/api/v1/ko6zugnynd0et"; 

        let products = [];
        let activeCategory = 'all';
        let selectedProduct = null; // Detail Modal ထဲတွင် ရွေးထားသော Product

        const productForm = document.getElementById('productForm');
        const productList = document.getElementById('productList');
        const searchInput = document.getElementById('searchInput');
        const totalItems = document.getElementById('totalItems');
        const emptyState = document.getElementById('emptyState');
        const categoryBar = document.getElementById('categoryBar');
        const formModal = document.getElementById('formModal');
        const detailModal = document.getElementById('detailModal');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const submitBtn = document.getElementById('submitBtn');

        // Form Modal အဖွင့်/အပိတ်
        function openAddModal() {
            document.getElementById('formModalTitle').innerHTML = `<i class="fas fa-plus-circle text-blue-500 mr-2"></i> စာရင်းအသစ်`;
            document.getElementById('editProductId').value = '';
            productForm.reset();
            // Default ကို ယနေ့ရက်စွဲ ထည့်ထားမည်
            document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
            
            formModal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
            setTimeout(() => document.getElementById('formName').focus(), 100);
        }

        function closeFormModal() {
            formModal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        // Detail Modal အဖွင့်/အပိတ်
        function openDetailModal(product) {
            selectedProduct = product;
            
            // Format တွက်ချက်ခြင်းများ
            const buyVal = Number(product.buy_price || 0);
            const sellVal = Number(product.price || 0);
            const profitVal = sellVal - buyVal;
            
            const detailContent = document.getElementById('detailContent');
            detailContent.innerHTML = `
                <div class="space-y-3">
                    <div>
                        <span class="text-xs font-bold text-gray-400 block">ကုန်ပစ္စည်းအမည်</span>
                        <span class="text-base font-bold text-gray-800">${product.name || '-'}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <span class="text-xs font-bold text-gray-400 block">အမျိုးအစား</span>
                            <span class="text-sm font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg inline-block mt-0.5">${product.category || '-'}</span>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-gray-400 block">အမှတ်တံဆိပ်</span>
                            <span class="text-sm font-semibold text-gray-700 inline-block mt-0.5">${product.brand || '-'}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2 border-t border-b py-3 my-2">
                        <div>
                            <span class="text-xs font-bold text-gray-400 block">ဝယ်ယူသည့်ဈေး</span>
                            <span class="text-base font-bold text-gray-600">${buyVal.toLocaleString()} Ks</span>
                        </div>
                        <div>
                            <span class="text-xs font-bold text-gray-400 block">ရောင်းချသည့်ဈေး</span>
                            <span class="text-lg font-extrabold text-emerald-600">${sellVal.toLocaleString()} Ks</span>
                        </div>
                    </div>

                    <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl">
                        <div>
                            <span class="text-xs font-bold text-gray-500 block">ခန့်မှန်းအမြတ်ငွေ</span>
                            <span class="text-sm font-bold text-emerald-600">+${profitVal.toLocaleString()} Ks</span>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-gray-400 block">စာရင်းသွင်းရက်စွဲ</span>
                            <span class="text-sm font-semibold text-gray-700">${product.date || '-'}</span>
                        </div>
                    </div>
                </div>
            `;
            
            detailModal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        function closeDetailModal() {
            detailModal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
            selectedProduct = null;
        }

        // မြန်မာဂဏန်းပြောင်းနည်း
        const toMyanmarNumber = (num) => {
            const numbers = {'0':'၀','1':'၁','2':'၂','3':'၃','4':'၄','5':'၅','6':'၆','7':'၇','8':'၈','9':'၉'};
            return num.toString().replace(/[0-9]/g, match => numbers[match]);
        };

        // Data ဆွဲယူခြင်း (GET)
        async function fetchProducts() {
            loadingOverlay.classList.remove('hidden');
            try {
                const response = await fetch(SHEETDB_URL);
                if(response.ok) {
                    products = await response.json();
                    renderCategoryChips();
                    applyFilters();
                }
            } catch (error) {
                console.error(error);
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        // အမျိုးအစားခွဲများ ဖန်တီးပြသခြင်း
        function renderCategoryChips() {
            categoryBar.innerHTML = '';
            const uniqueCategories = [...new Set(products.map(p => p.category))].filter(Boolean);
            
            const createChip = (label, value) => {
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-full whitespace-nowrap text-xs font-bold transition border ${activeCategory === value ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'}`;
                btn.innerText = label;
                btn.onclick = () => { activeCategory = value; renderCategoryChips(); applyFilters(); };
                categoryBar.appendChild(btn);
            };

            createChip('အားလုံး', 'all');
            uniqueCategories.forEach(cat => createChip(cat, cat));
        }

        // Filter စစ်ထုတ်ခြင်း
        function applyFilters() {
            let filtered = products;
            if (activeCategory !== 'all') filtered = filtered.filter(p => p.category === activeCategory);
            const term = searchInput.value.toLowerCase();
            if (term) {
                filtered = filtered.filter(p => 
                    (p.name && p.name.toLowerCase().includes(term)) || 
                    (p.category && p.category.toLowerCase().includes(term)) ||
                    (p.brand && p.brand.toLowerCase().includes(term))
                );
            }
            renderProducts(filtered);
        }

        // ဇယားထဲသို့ Data များ ထည့်သွင်းဆွဲပြခြင်း
        function renderProducts(items) {
            productList.innerHTML = '';
            if (items.length === 0) {
                productList.parentElement.classList.add('hidden');
                emptyState.classList.remove('hidden');
            } else {
                productList.parentElement.classList.remove('hidden');
                emptyState.classList.add('hidden');
                
                // နောက်ဆုံးသွင်းထားတာ အပေါ်ဆုံးပြရန် (Reverse Order)
                [...items].reverse().forEach(p => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-blue-50/40 cursor-pointer transition-colors";
                    
                    // တစ်ခုချင်းစီကို နှိပ်လိုက်ရင် အသေးစိတ်ပွင့်ရန်
                    tr.onclick = () => openDetailModal(p);
                    
                    tr.innerHTML = `
                        <td class="font-bold text-gray-800">
                            ${p.name || '-'}
                            <div class="sm:hidden text-[10px] text-gray-400 font-normal mt-0.5">${p.category || '-'}</div>
                        </td>
                        <td class="hidden sm:table-cell"><span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-md font-medium">${p.category || '-'}</span></td>
                        <td class="text-right font-bold text-blue-600">
                            ${Number(p.price || 0).toLocaleString()} <span class="text-[10px] text-gray-400 font-normal">Ks</span>
                        </td>
                        <td class="text-center text-blue-400">
                            <span class="w-8 h-8 rounded-full bg-blue-50 text-blue-600 hover:bg-blue-100 transition inline-flex items-center justify-center">
                                <i class="fas fa-eye text-xs"></i>
                            </span>
                        </td>
                    `;
                    productList.appendChild(tr);
                });
            }
            totalItems.innerText = `${toMyanmarNumber(items.length)} မျိုး`;
        }

        // Data သိမ်းဆည်းခြင်း (Add / Edit)
        productForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editProductId').value;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> သိမ်းဆည်းနေပါသည်';

            const nameVal = document.getElementById('formName').value;
            const priceVal = document.getElementById('formSellPrice').value;
            const buyPriceVal = document.getElementById('formBuyPrice').value;
            const categoryVal = document.getElementById('formCategory').value;
            const brandVal = document.getElementById('formBrand').value;
            const dateVal = document.getElementById('formDate').value;

            try {
                if (editId) {
                    // Update စနစ် (PUT)
                    const response = await fetch(`${SHEETDB_URL}/id/${editId}`, {
                        method: "PUT",
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: {
                                date: dateVal,
                                name: nameVal,
                                brand: brandVal,
                                category: categoryVal,
                                buy_price: buyPriceVal,
                                price: priceVal
                            }
                        })
                    });
                    if (response.ok) {
                        productForm.reset();
                        closeFormModal();
                        await fetchProducts();
                    }
                } else {
                    // အသစ်ထည့်စနစ် (POST)
                    const response = await fetch(SHEETDB_URL, {
                        method: "POST",
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            data: [
                                {
                                    id: Date.now().toString(),
                                    date: dateVal,
                                    name: nameVal,
                                    brand: brandVal,
                                    category: categoryVal,
                                    buy_price: buyPriceVal,
                                    price: priceVal
                                }
                            ]
                        })
                    });
                    if (response.ok) {
                        productForm.reset();
                        closeFormModal();
                        await fetchProducts();
                    }
                }
            } catch (error) {
                alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ။ အင်တာနက်ကို ပြန်စစ်ကြည့်ပေးပါ။");
                console.error(error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "သိမ်းမည်";
            }
        });

        // Detail ထဲမှ ပြင်ဆင်ရန် နှိပ်သည့်အခါ
        function editFromDetail() {
            if (!selectedProduct) return;
            
            // Edit Form ထဲ အချက်အလက်များ ဖြည့်စွက်ပေးခြင်း
            document.getElementById('formModalTitle').innerHTML = `<i class="fas fa-edit text-amber-500 mr-2"></i> စာရင်းပြင်ဆင်ရန်`;
            document.getElementById('editProductId').value = selectedProduct.id;
            document.getElementById('formDate').value = selectedProduct.date || new Date().toISOString().split('T')[0];
            document.getElementById('formName').value = selectedProduct.name || '';
            document.getElementById('formBrand').value = selectedProduct.brand || '';
            document.getElementById('formCategory').value = selectedProduct.category || '';
            document.getElementById('formBuyPrice').value = selectedProduct.buy_price || '';
            document.getElementById('formSellPrice').value = selectedProduct.price || '';

            // Detail Modal ပိတ်ပြီး Form Modal ဖွင့်ရန်
            closeDetailModal();
            formModal.classList.remove('opacity-0', 'pointer-events-none');
            document.body.classList.add('modal-active');
        }

        // Detail ထဲမှ ဖျက်ရန် နှိပ်သည့်အခါ
        async function deleteFromDetail() {
            if (!selectedProduct) return;
            
            if(confirm(`"${selectedProduct.name}" ကို ဖျက်ရန် သေချာပါသလား?`)) {
                const targetId = selectedProduct.id;
                closeDetailModal();
                loadingOverlay.classList.remove('hidden');
                
                try {
                    const response = await fetch(`${SHEETDB_URL}/id/${targetId}`, {
                        method: "DELETE",
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
                    });
                    
                    if (response.ok) {
                        await fetchProducts();
                    } else {
                        alert("ဖျက်ရာတွင် အမှားအယွင်း ရှိခဲ့ပါသည်။");
                    }
                } catch (error) {
                    alert("ချိတ်ဆက်မှု မအောင်မြင်ပါ။");
                    console.error(error);
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            }
        }

        searchInput.addEventListener('input', applyFilters);
        
        // App စတင်သည်နှင့် Data ကို ဆွဲယူမည်
        fetchProducts();
    </script>
</body>
</html>
